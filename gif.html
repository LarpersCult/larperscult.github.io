<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Larpers Cult GIF</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000;
      }

      img {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <img src="images/brain-tremble-petelgeuse.gif" alt="Animated GIF" />
    <script>
      const gif = document.querySelector("img");
      const closeAfterPlayback = () => {
        window.setTimeout(() => window.close(), 2100);
      };

      if (gif.complete && gif.naturalWidth > 0) {
        closeAfterPlayback();
      } else {
        gif.addEventListener("load", closeAfterPlayback, { once: true });
      }
    </script>
  </body>
</html>
